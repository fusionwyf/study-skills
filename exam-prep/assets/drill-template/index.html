<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exam Prep Drill</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <script>
    // KaTeX auto-render: formulas are written inline as \(...\) and \[...\].
    // Missing KaTeX (offline) leaves the LaTeX source readable.
    document.addEventListener("DOMContentLoaded", function () {
      if (!window.renderMathInElement) return;
      window.__EXAM_PREP_MATH_READY__ = true;
      window.renderExamPrepMath = function (scope) {
        renderMathInElement(scope || document.body, {
          delimiters: [
            {left: "\\(", right: "\\)", display: false},
            {left: "\\[", right: "\\]", display: true}
          ],
          throwOnError: false
        });
      };
      window.renderExamPrepMath(document.body);
    });
  </script>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --text: #1c2024;
      --muted: #606975;
      --line: #d9dee7;
      --accent: #2457c5;
      --accent-soft: #eaf0ff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111827;
        --panel: #1f2937;
        --text: #f3f4f6;
        --muted: #aeb8c5;
        --line: #374151;
        --accent: #7ea2ff;
        --accent-soft: #26375e;
      }
      input, textarea, button, .pill { background: #172033; color: var(--text); }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 28px 18px 48px;
    }
    header {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      margin-bottom: 18px;
    }
    h1 {
      margin: 0;
      font-size: 24px;
      letter-spacing: 0;
    }
    .timer {
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      font-variant-numeric: tabular-nums;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 18px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
    }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 14px;
    }
    .pill {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 3px 9px;
      background: #fff;
    }
    .prompt {
      white-space: pre-wrap;
      margin-bottom: 18px;
    }
    /* KaTeX renders into .katex / .katex-display; allow wide display math to scroll. */
    .katex-display {
      overflow-x: auto;
      overflow-y: hidden;
      padding: 4px 0;
    }
    textarea, input[type="text"] {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 11px 12px;
      font: inherit;
      background: #fff;
      color: var(--text);
    }
    textarea {
      min-height: 150px;
      resize: vertical;
    }
    .choices {
      display: grid;
      gap: 8px;
      margin-bottom: 16px;
    }
    label.choice {
      display: flex;
      gap: 10px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      cursor: pointer;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }
    button {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      border-radius: 8px;
      padding: 9px 12px;
      font: inherit;
      cursor: pointer;
    }
    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .answer {
      display: none;
      margin-top: 16px;
      padding: 14px;
      border-left: 4px solid var(--accent);
      background: var(--accent-soft);
      white-space: pre-wrap;
    }
    .status {
      min-height: 24px;
      margin-top: 14px;
      color: var(--muted);
      font-size: 14px;
    }
    .nav {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 16px;
    }
    @media (max-width: 640px) {
      header { align-items: flex-start; flex-direction: column; }
      .nav { flex-direction: column; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Exam Prep Drill</h1>
        <div class="meta">Replace the sample questions array in this file before using.</div>
      </div>
      <div class="timer" id="timer">00:00</div>
    </header>

    <section class="card">
      <div class="meta" id="meta"></div>
      <div class="prompt" id="prompt"></div>
      <div id="answerBox"></div>
      <div class="actions">
        <button class="primary" id="revealBtn" type="button">Reveal answer / rubric</button>
        <button id="copyBtn" type="button">Copy attempt record</button>
      </div>
      <div class="status" id="status" role="status" aria-live="polite"></div>
      <div class="answer" id="answer"></div>
      <div class="nav">
        <button id="prevBtn" type="button">Previous</button>
        <button id="nextBtn" type="button">Next</button>
      </div>
    </section>
  </main>

  <script>
    var questions = [
      {
        id: "Q0001",
        source: "sample",
        type: "fill",
        topic: "unclassified",
        difficulty: "unknown",
        estimated_time: 2,
        prompt: "Replace this sample with a real fill-in question. Example formula: \\(a^2+b^2=c^2\\).",
        choices: [],
        answer_or_rubric: "Put the expected answer or rubric here. Block formulas use \\[x=\\frac{-b\\pm\\sqrt{b^2-4ac}}{2a}\\].",
        synthetic: false
      }
    ];

    var startedAt = Date.now();
    var index = 0;
    var answers = {};
    var timerId = null;
    var finished = false;

    function pad(value) {
      return String(value).padStart(2, "0");
    }

    function updateTimer() {
      var elapsed = Math.floor((Date.now() - startedAt) / 1000);
      document.getElementById("timer").textContent = pad(Math.floor(elapsed / 60)) + ":" + pad(elapsed % 60);
    }

    function setStatus(message) {
      document.getElementById("status").textContent = message || "";
    }

    function stopTimer() {
      if (timerId !== null) {
        window.clearInterval(timerId);
        timerId = null;
      }
      finished = true;
      setStatus("Drill complete. Review the copied records with the Agent.");
    }

    function currentQuestion() {
      return questions[index];
    }

    function saveAnswer(value) {
      answers[currentQuestion().id] = value;
    }

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function renderMathText(element, text) {
      // Keep the LaTeX delimiters in the markup; KaTeX auto-render scans the
      // container afterwards. Without KaTeX the source stays readable.
      element.innerHTML = escapeHtml(text || "");
      if (window.renderExamPrepMath) window.renderExamPrepMath(element);
    }

    function renderQuestionContent(element, question, key) {
      var htmlKey = key + "_html";
      if (question[htmlKey]) {
        element.innerHTML = question[htmlKey];
        if (window.renderExamPrepMath) window.renderExamPrepMath(element);
        return;
      }
      renderMathText(element, question[key] || "");
    }

    function renderAnswerBox(question) {
      var container = document.getElementById("answerBox");
      container.innerHTML = "";

      if (question.type === "choice" && Array.isArray(question.choices) && question.choices.length > 0) {
        var choices = document.createElement("div");
        choices.className = "choices";
        question.choices.forEach(function(choice, choiceIndex) {
          var label = document.createElement("label");
          label.className = "choice";
          var radio = document.createElement("input");
          radio.type = "radio";
          radio.name = "choice";
          radio.value = choice;
          radio.checked = answers[question.id] === choice;
          radio.addEventListener("change", function() { saveAnswer(choice); });
          var span = document.createElement("span");
          span.textContent = choice;
          label.appendChild(radio);
          label.appendChild(span);
          choices.appendChild(label);
        });
        container.appendChild(choices);
        return;
      }

      if (question.type === "fill" || question.type === "short") {
        var input = document.createElement("input");
        input.type = "text";
        input.placeholder = "Type your answer";
        input.value = answers[question.id] || "";
        input.addEventListener("input", function(event) { saveAnswer(event.target.value); });
        container.appendChild(input);
        return;
      }

      var textarea = document.createElement("textarea");
      textarea.placeholder = "Paste or write your answer. Big-question feedback should be done by the Agent with the rubric.";
      textarea.value = answers[question.id] || "";
      textarea.addEventListener("input", function(event) { saveAnswer(event.target.value); });
      container.appendChild(textarea);
    }

    function render() {
      var question = currentQuestion();
      document.getElementById("meta").innerHTML = "";
      ["id", "source", "type", "topic", "difficulty"].forEach(function(key) {
        var span = document.createElement("span");
        span.className = "pill";
        span.textContent = key + ": " + question[key];
        document.getElementById("meta").appendChild(span);
      });
      renderQuestionContent(document.getElementById("prompt"), question, "prompt");
      document.getElementById("answer").style.display = "none";
      if (question.answer_or_rubric || question.answer_or_rubric_html) {
        renderQuestionContent(document.getElementById("answer"), question, "answer_or_rubric");
      } else {
        renderMathText(document.getElementById("answer"), "No answer or rubric provided.");
      }
      document.getElementById("nextBtn").textContent = index === questions.length - 1 ? "Finish" : "Next";
      renderAnswerBox(question);
    }

    function copyRecord() {
      var question = currentQuestion();
      var elapsed = Math.floor((Date.now() - startedAt) / 1000);
      var record = [
        "# Exam Prep Attempt",
        "",
        "- question_id: " + question.id,
        "- source: " + question.source,
        "- type: " + question.type,
        "- topic: " + question.topic,
        "- synthetic: " + String(Boolean(question.synthetic)),
        "- elapsed_seconds: " + elapsed,
        "",
        "## User Answer",
        "",
        answers[question.id] || "",
        "",
        "## Reflection",
        "",
        "- confidence:",
        "- suspected_cause:",
        "- notes:"
      ].join("\n");
      copyText(record).then(function() {
        setStatus("Attempt record copied.");
      }).catch(function() {
        setStatus("Copy failed. Select and copy the record manually.");
      });
    }

    function copyText(value) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        return navigator.clipboard.writeText(value);
      }
      return new Promise(function(resolve, reject) {
        var helper = document.createElement("textarea");
        helper.value = value;
        helper.style.position = "fixed";
        helper.style.opacity = "0";
        document.body.appendChild(helper);
        helper.select();
        try {
          if (document.execCommand("copy")) {
            resolve();
          } else {
            reject(new Error("copy command failed"));
          }
        } finally {
          document.body.removeChild(helper);
        }
      });
    }

    document.getElementById("revealBtn").addEventListener("click", function() {
      var answer = document.getElementById("answer");
      answer.style.display = answer.style.display === "block" ? "none" : "block";
    });
    document.getElementById("copyBtn").addEventListener("click", copyRecord);
    document.getElementById("prevBtn").addEventListener("click", function() {
      index = Math.max(0, index - 1);
      render();
    });
    document.getElementById("nextBtn").addEventListener("click", function() {
      if (index === questions.length - 1) {
        stopTimer();
        return;
      }
      index += 1;
      render();
    });

    document.addEventListener("keydown", function(event) {
      var tag = document.activeElement && document.activeElement.tagName;
      if (tag === "INPUT" || tag === "TEXTAREA") return;
      if (event.key === "ArrowLeft") document.getElementById("prevBtn").click();
      if (event.key === "ArrowRight") document.getElementById("nextBtn").click();
      if (event.key === " ") {
        event.preventDefault();
        document.getElementById("revealBtn").click();
      }
    });

    render();
    timerId = window.setInterval(updateTimer, 1000);
    updateTimer();
  </script>
</body>
</html>
